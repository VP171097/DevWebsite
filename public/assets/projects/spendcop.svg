<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Budget dashboard: safe-to-spend, plan versus actual, savings goals">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="55%" stop-color="#17120a" />
      <stop offset="100%" stop-color="#0d0b07" />
    </linearGradient>
    <linearGradient id="scBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="scLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="scGlow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="scGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#scBg)" />
  <rect width="800" height="450" fill="url(#scGrid)" />
  <rect width="800" height="450" fill="url(#scGlow)" />

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="56" y="70" font-size="22" fill="#f8fafc" font-weight="700">SpendCop</text>
    <text x="56" y="95" font-size="12.5" fill="#fcd34d">Safe-to-spend · plan vs actual · goals</text>
  </g>

  <!-- safe-to-spend card -->
  <g>
    <rect x="56" y="124" width="250" height="104" rx="14" fill="#14110c" stroke="#f59e0b" stroke-opacity="0.3" />
    <text x="76" y="152" font-size="11" fill="#94a3b8" font-family="Inter, sans-serif" letter-spacing="1.2">SAFE TO SPEND</text>
    <text x="76" y="192" font-size="34" fill="#fbbf24" font-weight="700" font-family="Inter, sans-serif">₹ 12,480</text>
    <text x="76" y="213" font-size="10.5" fill="#64748b" font-family="Inter, sans-serif">after bills, savings and goals</text>
  </g>

  <!-- monthly bars -->
  <g>
    <rect x="336" y="124" width="408" height="104" rx="14" fill="#14110c" stroke="#f59e0b" stroke-opacity="0.18" />
    <g>
      <rect x="364" y="186" width="20" height="28" rx="4" fill="url(#scBar)" opacity="0.85" />
      <rect x="400" y="170" width="20" height="44" rx="4" fill="url(#scBar)" opacity="0.85" />
      <rect x="436" y="158" width="20" height="56" rx="4" fill="url(#scBar)" opacity="0.9" />
      <rect x="472" y="176" width="20" height="38" rx="4" fill="url(#scBar)" opacity="0.85" />
      <rect x="508" y="148" width="20" height="66" rx="4" fill="url(#scBar)" />
      <rect x="544" y="164" width="20" height="50" rx="4" fill="url(#scBar)" opacity="0.85" />
      <rect x="580" y="182" width="20" height="32" rx="4" fill="url(#scBar)" opacity="0.8" />
      <rect x="616" y="154" width="20" height="60" rx="4" fill="url(#scBar)" opacity="0.9" />
      <rect x="652" y="172" width="20" height="42" rx="4" fill="url(#scBar)" opacity="0.8" />
      <rect x="688" y="162" width="20" height="52" rx="4" fill="url(#scBar)" opacity="0.85" />
    </g>
    <text x="364" y="148" font-size="10.5" fill="#94a3b8" font-family="Inter, sans-serif" letter-spacing="1.2">THIS MONTH</text>
  </g>

  <!-- trend line -->
  <g>
    <rect x="56" y="252" width="688" height="130" rx="14" fill="#14110c" stroke="#f59e0b" stroke-opacity="0.18" />
    <path d="M86 352 C 170 318, 220 344, 290 322 S 420 286, 500 306 S 630 290, 712 272"
          fill="none" stroke="url(#scLine)" stroke-width="3" stroke-linecap="round" />
    <circle cx="712" cy="272" r="5" fill="#fcd34d" />
    <text x="86" y="286" font-size="10.5" fill="#94a3b8" font-family="Inter, sans-serif" letter-spacing="1.2">NET WORTH TREND</text>
  </g>

  <text x="56" y="414" font-size="10.5" fill="#64748b" font-family="Inter, sans-serif">
    React · TypeScript · local-first storage · optional cloud sync
  </text>
</svg>
