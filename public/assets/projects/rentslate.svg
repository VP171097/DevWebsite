<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15110a" />
      <stop offset="50%" stop-color="#1a1508" />
      <stop offset="100%" stop-color="#101418" />
    </linearGradient>
    <linearGradient id="accentRS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glowRS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradRS)" />

  <!-- Grid -->
  <g opacity="0.08" stroke="#fbbf24" stroke-width="1">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="260" cy="230" r="150" fill="#f59e0b" opacity="0.1" filter="url(#glowRS)" />

  <!-- Building -->
  <g transform="translate(160, 95)">
    <path d="M 0 90 L 100 20 L 200 90" fill="none" stroke="url(#accentRS)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowRS)" />
    <rect x="25" y="90" width="150" height="170" rx="6" fill="#1f1a0e" stroke="#fbbf24" stroke-width="2.5" />
    <!-- Rooms: paid (green), pending (orange), overdue (red) -->
    <rect x="45" y="112" width="40" height="34" rx="4" fill="#10b981" opacity="0.85" />
    <rect x="115" y="112" width="40" height="34" rx="4" fill="#10b981" opacity="0.85" />
    <rect x="45" y="162" width="40" height="34" rx="4" fill="#f59e0b" opacity="0.9" />
    <rect x="115" y="162" width="40" height="34" rx="4" fill="#10b981" opacity="0.85" />
    <rect x="45" y="212" width="40" height="34" rx="4" fill="#ef4444" opacity="0.85" />
    <rect x="115" y="212" width="40" height="48" rx="4" fill="#2a2310" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Bill / Receipt Card -->
  <g transform="translate(440, 90)">
    <rect x="0" y="0" width="230" height="270" rx="14" fill="#161616" stroke="#3f3a2a" stroke-width="2" />
    <rect x="0" y="0" width="230" height="52" rx="14" fill="url(#accentRS)" />
    <rect x="0" y="38" width="230" height="14" fill="url(#accentRS)" />
    <text x="20" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111">RentSlate</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a3a3a3">
      <text x="20" y="86">Rent</text>
      <text x="20" y="114">Electricity</text>
      <text x="20" y="142">Late fee</text>
      <text x="20" y="170">Prev. balance</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e5e5" text-anchor="end">
      <text x="210" y="86">₹ 8,000</text>
      <text x="210" y="114">₹ 640</text>
      <text x="210" y="142">₹ 0</text>
      <text x="210" y="170">₹ 250</text>
    </g>
    <line x1="20" y1="188" x2="210" y2="188" stroke="#3f3a2a" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="20" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">Total due</text>
    <text x="210" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="end">₹ 8,890</text>

    <rect x="20" y="232" width="84" height="24" rx="12" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="62" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">PAID</text>
  </g>

  <!-- Connector -->
  <path d="M 370 225 C 395 225, 405 225, 430 225" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 5" opacity="0.7" />
  <circle cx="430" cy="225" r="5" fill="#fbbf24" filter="url(#glowRS)" />
</svg>
