<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Delta Lake">
  <title>Delta Lake</title>
  <!-- Delta triangle -->
  <path
    d="M50 11 L89 83 L11 83 Z"
    fill="none"
    stroke="#00ADD4"
    stroke-width="11"
    stroke-linejoin="round"
  />
  <!-- Lake wave crossing the lower third -->
  <path
    d="M9 67 C 24 55, 37 74, 52 66 C 66 58, 78 66, 93 76"
    fill="none"
